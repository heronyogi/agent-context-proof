name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m contextproof.cli --json --require-ready > /tmp/context-proof.json
