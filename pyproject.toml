[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-context-proof"
version = "0.2.1"
description = "A reproducible synthetic evaluation of fail-closed governed context"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Agent Context Proof contributors"}]
dependencies = [
  "openai-agents==0.8.4",
  "openai>=2.19,<2.45",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "cryptography>=45,<51",
  "jsonschema>=4.25,<5",
  "pillow>=11,<13",
  "pytest>=8,<10",
  "rfc8785>=0.1.4,<0.2",
  "ruff>=0.12,<1",
]

[project.scripts]
context-proof = "contextproof.cli:main"
context-proof-agent = "contextproof.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contextproof = ["prompt.md"]
